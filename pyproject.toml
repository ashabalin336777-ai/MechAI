[tool.ruff]
target-version = "py312"
line-length = 100
# data/ — руководства и заглушки заказчика (код не редактируем, mock/ — компонент заказчика)
extend-exclude = ["data", "mock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# mock/ — заглушки заказчика; тесты импортируют их как mock_ml.app и mock_toir.app
pythonpath = [".", "mock"]
