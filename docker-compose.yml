# Compose для App Platform. Запрещено: volumes, privileged, extra_hosts, network_mode: host,
# include, extends, external, name, driver_opts; хост-порты 80 и 443.
# Первый сервис получает основной домен. Значения секретов задаются в панели или в локальном .env.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEURALDEEP_API_KEY: ${NEURALDEEP_API_KEY}
      NEURALDEEP_BASE_URL: ${NEURALDEEP_BASE_URL:-https://api.neuraldeep.ru/v1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      FAST_MODEL: ${FAST_MODEL:-qwen3.6-fp8}
      REASONING_MODEL: ${REASONING_MODEL:-qwen3.8-27b}
    restart: unless-stopped
