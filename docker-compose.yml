# Compose для Timeweb App Platform. Запрещено: volumes, privileged, extra_hosts, network_mode: host,
# include, extends, external, name, driver_opts; хост-порты 80 и 443.
# Первый сервис (app) получает основной домен. Переменные задаются в панели App Platform
# или подставляются из локального .env при запуске на своей машине. env_file не используем.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEURALDEEP_API_KEY: ${NEURALDEEP_API_KEY:-}
      NEURALDEEP_BASE_URL: ${NEURALDEEP_BASE_URL:-https://api.neuraldeep.ru/v1}
      AGENT_MODEL: ${AGENT_MODEL:-qwen3.8-flash-next-ru-noreason}
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-qwen3.8-flash-next-ru-noreason}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      RERANK_MODEL: ${RERANK_MODEL:-bge-reranker}
      OCR_MODEL: ${OCR_MODEL:-gemma-4-31b-noreason}
      OCR_FALLBACK_MODEL: ${OCR_FALLBACK_MODEL:-qwen3.6-35b-a3b-noreason}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      STT_BROWSER_FALLBACK: ${STT_BROWSER_FALLBACK:-0}
      MOCK_ML_URL: ${MOCK_ML_URL:-http://mock_ml:8001}
      MOCK_TOIR_URL: ${MOCK_TOIR_URL:-http://mock_toir:8002}
      SENSORS_URL: ${SENSORS_URL:-}
      MOUNT_MOCKS: ${MOUNT_MOCKS:-0}
      DATABASE_URL: ${DATABASE_URL:-}
      VEHICLES_PATH: ${VEHICLES_PATH:-mock/data/vehicles.json}
      FAULT_TYPES_PATH: ${FAULT_TYPES_PATH:-mock/data/fault_types.json}
      MANUALS_DIR: ${MANUALS_DIR:-data/manuals}
      MANUALS_YADISK_URL: ${MANUALS_YADISK_URL:-https://disk.yandex.ru/d/QdAA8p4m0ySe8Q}
      CONF_LOW: ${CONF_LOW:-0.60}
      SCORE_MEDIUM: ${SCORE_MEDIUM:-0.60}
      SCORE_HIGH: ${SCORE_HIGH:-0.80}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.80}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-45}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AUTH_MODE: ${AUTH_MODE:-demo}
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      COMMIT_SHA: ${COMMIT_SHA:-}
    depends_on:
      - mock_ml
      - mock_toir
    restart: unless-stopped
  mock_ml:
    build:
      context: ./mock
      dockerfile: Dockerfile
    command: uvicorn mock_ml.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    restart: unless-stopped
  mock_toir:
    build:
      context: ./mock
      dockerfile: Dockerfile
    command: uvicorn mock_toir.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    restart: unless-stopped
