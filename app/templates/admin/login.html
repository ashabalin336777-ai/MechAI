{% extends "base.html" %}
{% block content %}
<div class="logs-head">
  <h1 class="page-title">Вход в журнал агента</h1>
  <p class="muted">Введите токен администратора стенда (ADMIN_TOKEN). Токен не сохраняется в браузере: остаётся подписанная cookie на 8 часов.</p>
</div>

{% if error %}
<p class="notice notice-error" role="alert">{{ error }}</p>
{% endif %}

<form class="access-form" method="post" action="/admin/logs/access">
  <label for="token">Токен администратора</label>
  <input id="token" name="token" type="password" autocomplete="current-password" required>
  <button class="btn btn-primary btn-xl" type="submit">Войти</button>
</form>
{% endblock %}
