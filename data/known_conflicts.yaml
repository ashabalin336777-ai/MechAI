  # отрисовке страниц: одна величина, одни режимы. Таблица стр. 12 повёрнута, цитата задана
  # правилом и проверяется по числам.
  - id: yamz236_oil_pressure
    engine_models: ["ЯМЗ-236М2"]
    topic: "Давление масла в системе смазки при номинальных оборотах"
    keywords: ["давлен", "масл", "кпа", "номинальн", "минимальн"]
    min_matches: 3
    refs:
      - manual: "236.01.01 РК"
        pdf_page: 12
        quote: "Давление в масляной системе при номинальных оборотах: 400-730 (4-7,3) кПа"
      - manual: "236.01.01 РК"
        pdf_page: 267
    safe_rule: "400–700 кПа при номинальной частоте вращения (более узкий из двух диапазонов)"
