# Известные противоречия в руководствах (правила заказчика). Код не выбирает верную формулировку:
# он показывает обе со ссылками, пишет «в документации противоречие», даёт безопасное правило
# и просит уточнить у специалиста. Обозначения refs.manual — как в data/manuals/manifest.yaml.
#
# keywords — подстроки в нижнем регистре; правило срабатывает, если совпало не меньше min_matches
# слов в запросе механика или в найденных фрагментах этого двигателя.

conflicts:
  - id: yamz236_valve_clearance_timing
    engine_models: ["ЯМЗ-236М2"]
    topic: "Когда регулировать тепловые зазоры клапанов"
    keywords: ["зазор", "клапан", "холодн", "15 мин", "остановк"]
    min_matches: 3
    refs:
      - manual: "236-3902150-Б РЭ"
        pdf_page: 31
      - manual: "236.01.01 РК"
        pdf_page: 269
      - manual: "236.01.01 РК"
        pdf_page: 276
    safe_rule: "на холодном двигателе"
  # Давление масла: РК стр. 12 (таблица «Масляный насос», 400-730 кПа при номинальных оборотах)
