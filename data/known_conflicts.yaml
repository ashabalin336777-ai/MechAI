# Известные противоречия в руководствах (правила заказчика). Код не выбирает верную формулировку:
# блок с обеими показывает дословно со ссылками, пишет «в документации противоречие», даёт безопасное
# правило и просит уточнить у специалиста. Обозначения refs.manual — как в data/manuals/manifest.yaml.
# refs.quote — цитата. check: verbatim (по умолчанию) — цитата дословно на странице (переносы строк
# и перенос слов по дефису не учитываются); check: numbers — только числа цитаты на странице
# (для повёрнутых таблиц, где текст страницы не совпадает с цитатой побуквенно).
#
# keywords — подстроки в нижнем регистре; правило срабатывает, если совпало не меньше min_matches
# слов в запросе механика или в найденных фрагментах этого двигателя.

conflicts:
  - id: yamz236_valve_clearance_timing
    engine_models: ["ЯМЗ-236М2"]
    topic: "Когда регулировать тепловые зазоры клапанов"
    keywords: ["зазор", "клапан", "холодн", "15 мин", "остановк"]
    min_matches: 3
    query_keywords: ["тепловые зазоры", "15 минут"]
    refs:
      - manual: "236-3902150-Б РЭ"
        pdf_page: 31
        quote: "Тепловые зазоры регулировать на холодном двигателе или менее чем через 15 минут после его остановки."
      - manual: "236.01.01 РК"
        pdf_page: 269
        quote: "Проверить и подрегулировать тепловые зазоры клапанного механизма перед началом и по окончании обкатки, но не ранее, чем через 15 мин после остановки двигателя."
      - manual: "236.01.01 РК"
        pdf_page: 276
        quote: "Проверку регулировки зазоров в клапанном механизме производить на холодном двигателе или не ранее, чем через 15 минут после его остановки."
    safe_rule: "на холодном двигателе"
  # Давление масла: РК стр. 12 (таблица «Масляный насос», 400-730 кПа при номинальных оборотах)
  # и РК стр. 267 (п. 6.3.6, 400-700 кПа при номинальной частоте вращения). Проверено 27.11 по
  # отрисовке страниц: одна величина, одни режимы. Таблица стр. 12 повёрнута, цитата задана
  # правилом и проверяется по числам.
  - id: yamz236_oil_pressure
    engine_models: ["ЯМЗ-236М2"]
    topic: "Давление масла в системе смазки при номинальных оборотах"
    keywords: ["давлен", "масл", "кпа", "номинальн", "минимальн"]
    min_matches: 3
    query_keywords: ["давление масла номинальн", "давления масла номинальн"]
    refs:
      - manual: "236.01.01 РК"
        pdf_page: 12
        quote: "Давление в масляной системе при номинальных оборотах: 400-730 (4-7,3) кПа"
        check: numbers
      - manual: "236.01.01 РК"
        pdf_page: 267
    safe_rule: "400–700 кПа при номинальной частоте вращения (более узкий из двух диапазонов)"
